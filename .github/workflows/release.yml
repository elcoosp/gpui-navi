name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux dependencies (gpui)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (workspace lints, zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  changelog:
    name: Generate changelog with git-cliff
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      notes: CHANGELOG.md
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate a changelog for the current tag
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: "--latest --strip header --config-url https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml"
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: navi-codegen-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: navi-codegen-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: navi-codegen-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build navi-codegen release binary
        run: cargo build --release -p navi-codegen --target ${{ matrix.target }}
      - name: Package artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "../../../${{ matrix.artifact }}.tar.gz" navi-codegen
          cd ../../..
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [changelog, build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: changelog
          path: ./release-notes
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: navi-codegen-*
          path: ./assets
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ./release-notes/CHANGELOG.md
          files: |
            assets/*
          generate_release_notes: false
