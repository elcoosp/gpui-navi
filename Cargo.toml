[workspace]
resolver = "2"
members = [
    "navi-test",
    "stubs/history-navigation",
    "navi-core",
    "navi-router",
    "navi-macros",
    "navi-codegen",
    "navi-devtools",
    "example-app",
    "navi-router-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
# GPUI arrives through the `gpui-pre-*` crates.io snapshots that the post-
# restructure gpui-kit stack is built against. gpui-component 0.8 pins
# `gpui-pre =0.3.10` exactly, so declaring the same package under the `gpui`
# alias keeps every crate on one shared GPUI (a second, zed-git `gpui` would
# be a distinct crate whose types cannot cross into gpui-component APIs).
# The snapshot tracks recent zed main; it replaces the former
# `zed@git#697f5dde` pin.
#
# GPUI is a **binding** dependency in this workspace: only `example-app`
# (the host application) and the quoin GPUI adapter reference it. Every
# navi library crate is GUI-framework agnostic and builds on quoin instead.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# Post-restructure stack: `gpui-kit` is the application facade (re-exports
# GPUI, gpui-base, gpui-component and the bundled assets), `gpui-component`
# 0.8 is the styled component catalog used by navi-devtools.
gpui-kit = "0.8.1"
gpui-component = "0.8.1"

# quoin is the framework-agnostic reactive system + renderer contract every
# navi library crate builds on:
# - `quoin-core` — signals, executor/timer seams, portable sleep;
# - `quoin-ui` — the runtime `Node` UI tree the router components and
#   devtools render through;
# - `quoin-ui-gpui` — the GPUI adapter that materializes `Node` trees with
#   real gpui-component widgets (used by example-app only).
#
# Local path dependencies: quoin's navi-migration extensions (runtime Node
# model + renderer) are local commits, and the latest rs-query main depends
# on quoin through a relative `path = "../quoin/quoin-core"` dependency, so
# the three clones must sit side by side (workspaces/{quoin,rs-query,
# gpui-navi}). Once quoin/rs-query publish releases carrying these changes,
# these become plain version/git dependencies.
quoin-core = { path = "../quoin/quoin-core" }
quoin-ui = { path = "../quoin/quoin-ui" }
quoin-ui-gpui = { path = "../quoin/quoin-ui-gpui" }
send_wrapper = "0.6"

# rs-query main (0.2.0) — fully GUI-framework agnostic: its runtime seam
# (`QueryRuntime`) is backed by quoin's worker pool and portable timer, so
# `QueryClient` works with no UI framework and no ambient async runtime.
# Navi uses `QueryClient` / `Query` / `QueryKey` for route loaders.
rs-query = { path = "../rs-query" }

# Lean dev profile: line tables only (backtraces still work) and no
# incremental caches. Cuts target/ size by well over half, which matters
# for constrained CI runners and dev machines.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Release builds ship to end users: thin LTO crosses crate boundaries
# (the router is a multi-crate workspace) and a single codegen unit gives
# LLVM whole-graph inlining.
[profile.release]
lto = "thin"
codegen-units = 1

# Benchmarks keep symbols so samply/perf can attribute samples.
[profile.bench]
debug = true

# Workspace-wide lint policy. Pedantic is the baseline; CI runs clippy with
# `-D warnings` so any new pedantic hit fails the build. Suppression is done
# with targeted `#[expect]` (which errors when stale), never blanket `allow`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"


