[workspace]
resolver = "2"
members = [
    "navi-test",
    "stubs/history-navigation",
    "navi-core",
    "navi-router",
    "navi-macros",
    "navi-codegen",
    "navi-devtools",
    "example-app",
    "navi-router-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
# NOTE: the git stack (zed gpui / gpui-component / rs-query) is pinned by the
# lockfile to the newest mutually-compatible commits. Mid-2026 the
# `gpui-component` upstream restructured (`gpui-kit` split) with breaking API
# churn; every consumer must migrate together (see docs/BRAINSTORM.md).
# `rs-query` stays off its `devtools` feature, which drags in the new-layout
# gpui-component; Navi ships its own devtools UI.
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
rs-query = { git = "https://github.com/elcoosp/rs-query" }

# xattr 0.2.3 (pulled by async-tar via gpui's http_client) fails to compile
# against libc >= 0.2.187 on Linux (`ENOATTR` was removed upstream). A 1.x
# patch does not satisfy async-tar's `"0.2"` requirement, so a minimal
# patched copy is vendored under `vendor/xattr` (ENOATTR -> ENODATA on
# Linux/Android; the `xattr::set` API async-tar uses is unchanged).
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# Lean dev profile: line tables only (backtraces still work) and no
# incremental caches. Cuts target/ size by well over half, which matters
# for constrained CI runners and dev machines.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Workspace-wide lint policy. Pedantic is the baseline; CI runs clippy with
# `-D warnings` so any new pedantic hit fails the build. Suppression is done
# with targeted `#[expect]` (which errors when stale), never blanket `allow`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"

