[workspace]
resolver = "2"
members = [
    "navi-test",
    "stubs/history-navigation",
    "navi-core",
    "navi-router",
    "navi-macros",
    "navi-codegen",
    "navi-devtools",
    "example-app",
    "navi-router-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
# GPUI arrives through the `gpui-pre-*` crates.io snapshots that the post-
# restructure gpui-kit stack is built against. gpui-component 0.8 pins
# `gpui-pre =0.3.10` exactly, so declaring the same package under the `gpui`
# alias keeps every crate on one shared GPUI (a second, zed-git `gpui` would
# be a distinct crate whose types cannot cross into gpui-component APIs).
# The snapshot tracks recent zed main; it replaces the former
# `zed@git#697f5dde` pin.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# Post-restructure stack: `gpui-kit` is the application facade (re-exports
# GPUI, gpui-base, gpui-component and the bundled assets), `gpui-component`
# 0.8 is the styled component catalog used by navi-devtools.
gpui-kit = "0.8.1"
gpui-component = "0.8.1"
# rs-query main (0.1.0). Navi keeps using only its gpui-free core
# (`QueryClient` / `Query` / `QueryKey`): the crate itself still tracks
# zed-git gpui, which stays a leaf in the graph because none of its used APIs
# expose gpui types. Its optional `devtools` feature remains OFF — it drags
# the new-layout gpui-component, and Navi ships its own devtools UI.
rs-query = { git = "https://github.com/elcoosp/rs-query", rev = "87b3742cbbf1938bcee0fe0c84c99bdf60a03a01" }

# Lean dev profile: line tables only (backtraces still work) and no
# incremental caches. Cuts target/ size by well over half, which matters
# for constrained CI runners and dev machines.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Workspace-wide lint policy. Pedantic is the baseline; CI runs clippy with
# `-D warnings` so any new pedantic hit fails the build. Suppression is done
# with targeted `#[expect]` (which errors when stale), never blanket `allow`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"

