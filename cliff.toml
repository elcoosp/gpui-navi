# git-cliff configuration (see https://git-cliff.org/docs/configuration)
# Changelog format: Keep a Changelog, driven by Conventional Commits.

[changelog]
# A blank header keeps generated files clean; release.yml strips it anyway.
header = """
<!-- generated by git-cliff -->
"""
# Template for each release section.
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group }}

  {% for commit in commits %}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
      {% if commit.breaking %}[**breaking**] {% endif %}\
      {{ commit.message | upper_first }} \
      {% if commit.remote.pr_number %}([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})){% endif %}\
      {% if commit.remote.username %} (by [@{{ commit.remote.username }}]({{ self::remote_url() }}/{{ commit.remote.pr_number and "pull/" ~ commit.remote.pr_number or "commit/" }}{{ commit.id }})){% endif %}
  {%- endfor %}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ### 💞 New Contributors
  {%- for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
    - @{{ contributor.username }} made their first contribution
      {%- if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
      {%- endif %}
  {%- endfor %}
{%- endif -%}

{% if version and previous.version -%}
  [{{ version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
# Template for the full changelog written to CHANGELOG.md.
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading/trailing whitespace from the generated output.
trim = true

[git]
# Parse commits according to Conventional Commits.
conventional_commits = true
# Ignore commits that do not parse (keeps the changelog noise-free).
filter_unconventional = false
# Split commits on newlines for a friendlier list.
split_commits = false
# Breaking-change commits are always included, even if a parser would skip them.
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(scope\\)", skip = true },
  { message = "^chore", group = "⚙️ Miscellaneous Tasks" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = ".*", group = "Other" },
]
commit_preprocessors = [
  # Remove issue-number suffixes like "(#123)" already rendered separately.
  { pattern = ' *\((\w+\s)?#([0-9]+)\)', replace = "" },
]
tag_pattern = "v[0-9].*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "elcoosp"
repo = "gpui-navi"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
