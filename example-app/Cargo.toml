[package]
publish = false
name = "example-app"
version.workspace = true
edition = "2024"
build = "build.rs"

[package.metadata.bundle]
name = "Navi Example"
identifier = "com.navi.example-app"
icon = ["icon.png"]
version.workspace = true
copyright = "MIT"
category = "public.app-category.developer-tools"
short_description = "Navi Example"
long_description = "Example application for Navi on quoin + GPUI."
osx_url_schemes = ["naviapp"]

[dependencies]
# The binding layer: this binary is where a GUI framework is chosen. GPUI
# provides windowing; quoin's GPUI adapter (quoin-ui-gpui) renders the
# framework-agnostic navi Node trees (router components + devtools panel).
gpui = { workspace = true }
# The application facade: GPUI + gpui-base + gpui-component + bundled assets,
# with `application()` / `init()` / `open_window()` entry points.
gpui-kit = { workspace = true }
# Platform backend features (font-kit, X11, Wayland, runtime shaders) that
# gpui-kit leaves off by default; additive across the shared gpui-pre-platform.
gpui_platform = { workspace = true }
# quoin runtime pieces used by the host wiring (portable sleep helpers).
quoin-ui = { workspace = true }
quoin-ui-gpui = { workspace = true }
send_wrapper = { workspace = true }
rs-query = { workspace = true }
navi-core = { path = "../navi-core" }
navi-router = { path = "../navi-router" }
navi-devtools = { path = "../navi-devtools" }
navi-macros = { path = "../navi-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
# Validation crate integrations (optional, for testing)
validator = { version = "0.21", features = ["derive"], optional = true }
garde = { version = "0.23.0", features = ["derive"], optional = true }
validify = { version = "2.0", optional = true }
valico = { version = "4.0", optional = true }
schemars = { version = "1.2", optional = true }

[features]
default = []
validator = ["navi-router/validator", "dep:validator"]
garde = ["navi-router/garde", "dep:garde"]
validify = ["navi-router/validify", "dep:validify"]
valico = ["navi-router/valico", "dep:valico", "dep:schemars"]

# Enable all for testing
[build-dependencies]
navi-codegen = { path = "../navi-codegen" }

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
