# navi-codegen/Cargo.toml
[package]
documentation = "https://gpui-navi.vercel.app"

description = "The navi-codegen crate for the gpui-navi ecosystem"
license = "MIT"
repository = "https://github.com/elcoosp/gpui-navi"
readme = "../README.md"
name = "navi-codegen"
keywords = ["gpui", "router", "codegen", "macro", "derive"]
version.workspace = true
edition = "2024"

[[bin]]
name = "navi-codegen"
path = "src/main.rs"

[dependencies]
regex = "1.13"
walkdir = "2.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
