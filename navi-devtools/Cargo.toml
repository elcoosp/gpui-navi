[package]
documentation = "https://gpui-navi.vercel.app"

description = "The navi-devtools crate for the gpui-navi ecosystem"
license = "MIT"
repository = "https://github.com/elcoosp/gpui-navi"
readme = "../README.md"
name = "navi-devtools"
keywords = ["gpui", "router", "devtools", "ui", "desktop"]
version.workspace = true
edition = "2024"

[dependencies]
# Framework-agnostic stack: the panel model renders `quoin_ui::Node`
# trees; no GUI framework is named anywhere in this crate.
quoin-core = { workspace = true }
quoin-ui = { workspace = true }

rs-query = { workspace = true }
navi-router = { path = "../navi-router" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
