[package]
documentation = "https://gpui-navi.vercel.app"

description = "The navi-macros crate for the gpui-navi ecosystem"
license = "MIT"
repository = "https://github.com/elcoosp/gpui-navi"
readme = "../README.md"
name = "navi-macros"
keywords = ["gpui", "router", "macro", "codegen", "derive"]
version.workspace = true
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
