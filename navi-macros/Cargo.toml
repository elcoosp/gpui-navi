[package]
name = "navi-macros"
version.workspace = true
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
