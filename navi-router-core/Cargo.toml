[package]
name = "navi-router-core"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
log = "0.4"
url = "2.5"
rustc-hash = "2.1"
smallvec = "1"
history-navigation = { path = "../stubs/history-navigation" }

# Validation crate integrations (optional)
validator = { version = "0.21", features = ["derive"], optional = true }
garde = { version = "0.23", features = ["derive"], optional = true }
validify = { version = "2.0", optional = true }
valico = { version = "4.0", optional = true }
schemars = { version = "1.2", optional = true }

# Nested / bracketed search-param parsing (`filter[status]=open`) (optional)
serde_qs = { version = "1.1", optional = true }

[features]
default = []
validator = ["dep:validator"]
garde = ["dep:garde"]
validify = ["dep:validify"]
valico = ["dep:valico", "dep:schemars"]
nested-search = ["dep:serde_qs"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "core"
harness = false

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
