[package]
description = "The navi-router crate for the gpui-navi ecosystem"
license = "MIT"
repository = "https://github.com/elcoosp/gpui-navi"
readme = "../README.md"
name = "navi-router"
keywords = ["gpui", "router", "navigation", "desktop", "ui"]
version.workspace = true
edition = "2024"

[dependencies]
# Framework-agnostic stack: quoin provides the reactive runtime seam
# (portable sleep for loaders) and the `Node` UI contract the components
# render through. No GUI framework is named anywhere in this crate.
quoin-core = { workspace = true }
quoin-ui = { workspace = true }

navi-core = { path = "../navi-core" }
navi-router-core = { path = "../navi-router-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.13"
rustc-hash = "2.1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rs-query = { workspace = true }


[features]
default = []
# Validation integrations are implemented in navi-router-core; forward here
# so downstream crates only need `navi-router = { features = ["validator"] }`.
validator = ["navi-router-core/validator"]
garde = ["navi-router-core/garde"]
validify = ["navi-router-core/validify"]
valico = ["navi-router-core/valico"]
# Bracketed nested search params (`filter[status]=open`), see
# `parse_query_nested` / `query_to_string`.
nested-search = ["navi-router-core/nested-search"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "adapter"
harness = false

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
