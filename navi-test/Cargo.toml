[package]
name = "navi-test"
version.workspace = true
edition = "2024"

[dev-dependencies]
gpui = { workspace = true }
navi-router = { path = "../navi-router" }
navi-router-core = { path = "../navi-router-core" }
navi-macros = { path = "../navi-macros" }
rs-query = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
