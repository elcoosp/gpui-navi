[package]
name = "navi-test"
version.workspace = true
edition = "2024"

[dev-dependencies]
# Headless integration tests: the router seam runs on a queued test host,
# so no GUI framework or async runtime is needed — only `futures` for
# `block_on`.
navi-router = { path = "../navi-router" }
navi-router-core = { path = "../navi-router-core" }
navi-core = { path = "../navi-core" }
navi-macros = { path = "../navi-macros" }
quoin-ui = { workspace = true }
rs-query = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
