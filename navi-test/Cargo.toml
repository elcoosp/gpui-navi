[package]
name = "navi-test"
version.workspace = true
edition = "2024"

[dev-dependencies]
# `test-support` powers `TestAppContext` / `#[gpui::test]`; it used to arrive
# via feature unification with rs-query's shared zed-git gpui, but the
# gpui-pre snapshot is a distinct package, so it is requested explicitly now.
gpui = { workspace = true, features = ["test-support"] }
navi-router = { path = "../navi-router" }
navi-router-core = { path = "../navi-router-core" }
navi-macros = { path = "../navi-macros" }
rs-query = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

# Inherit the workspace lint policy (pedantic clippy, no unsafe).
[lints]
workspace = true
